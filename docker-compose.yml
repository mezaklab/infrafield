services:
  postgres:
    image: postgres:16-alpine
    container_name: infrafield-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infrafield_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infrafield_password}
      POSTGRES_DB: ${POSTGRES_DB:-infrafield_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infrafield_user} -d ${POSTGRES_DB:-infrafield_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: infrafield-evolution
    restart: always
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${WHATSAPP_TOKEN:-infrafield_secret_key}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      # Armazenamento de sessão WhatsApp (persistência entre restarts)
      DATABASE_ENABLED: "false"
      STORE_MESSAGES: "true"
      STORE_MESSAGE_UP: "true"
      STORE_CONTACTS: "true"
      STORE_CHATS: "true"
      # Configurações de QR Code e conexão
      QRCODE_LIMIT: "30"
      DEL_INSTANCE: "false"
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: infrafield-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - postgres

volumes:
  postgres_data:
  evolution_instances:
  evolution_store:

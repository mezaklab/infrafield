services:
  postgres:
    image: postgres:16-alpine
    container_name: infrafield-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infrafield_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infrafield_password}
      POSTGRES_DB: ${POSTGRES_DB:-infrafield_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infrafield_user} -d ${POSTGRES_DB:-infrafield_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: infrafield-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - postgres

volumes:
  postgres_data:

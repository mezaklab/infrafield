services:
  postgres:
    image: postgres:16-alpine
    container_name: infrafield-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infrafield_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-infrafield_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - infrafield-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infrafield_user} -d ${POSTGRES_DB:-infrafield_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: infrafield-evolution
    restart: always
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${WHATSAPP_TOKEN:?Defina WHATSAPP_TOKEN no arquivo .env}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      # Armazenamento de sessão WhatsApp (persistência entre restarts)
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: "postgresql"
      DATABASE_CONNECTION_URI: "postgresql://${POSTGRES_USER:-infrafield_user}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@infrafield-postgres:5432/${POSTGRES_DB:-infrafield_db}?schema=public"
      # Esta instalacao nao possui Redis. O default da Evolution v2 tenta
      # localhost:6379 continuamente e bloqueia/atrasa o envio de mensagens.
      CACHE_REDIS_ENABLED: "false"
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "true"
      STORE_MESSAGES: "true"
      STORE_MESSAGE_UP: "true"
      STORE_CONTACTS: "true"
      STORE_CHATS: "true"
      # Configurações de QR Code e conexão
      QRCODE_LIMIT: "30"
      DEL_INSTANCE: "false"
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - infrafield-net
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: infrafield-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - infrafield-net
    depends_on:
      - postgres

volumes:
  postgres_data:
  evolution_instances:
  evolution_store:

networks:
  infrafield-net:
    driver: bridge
